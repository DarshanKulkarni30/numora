<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="NumoraWisdom mark">
  <!-- Open ring: gap at bottom ~5-7 o'clock; gold on upper-right arc -->
  <path
    d="M 78 210 A 100 100 0 1 1 178 210"
    fill="none"
    stroke="#1e3a5f"
    stroke-width="7"
    stroke-linecap="round"
  />
  <path
    d="M 178 56 A 100 100 0 0 1 220 128"
    fill="none"
    stroke="#c9a227"
    stroke-width="7"
    stroke-linecap="round"
  />
  <!-- Green cradle base closing the open gap -->
  <path
    d="M 70 208 Q 128 248 186 208"
    fill="none"
    stroke="#5a8f6a"
    stroke-width="14"
    stroke-linecap="round"
  />
  <!-- NW monogram -->
  <g fill="#1e3a5f" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text x="72" y="148" font-size="92">N</text>
    <text x="108" y="168" font-size="78">W</text>
  </g>
  <path d="M 92 88 L 118 148" fill="none" stroke="#c9a227" stroke-width="3" stroke-linecap="round"/>
</svg>
